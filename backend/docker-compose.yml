services:
  postgres:
    image: postgres:15-alpine
    container_name: absenzdash-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: absenzdash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in .env gesetzt sein}
      POSTGRES_DB: absenzdash
    ports:
      - "127.0.0.1:5431:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U absenzdash"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - absenzdash-db-data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: absenzdash-backend
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./data/schueler.csv:/tmp/schueler.csv:ro
      - ./data/asv-csv-archiv:/data/asv-csv-archiv
    networks:
      - default
      - absenzflow-shared
      - absenzdash-proxy

volumes:
  absenzdash-db-data:

networks:
  default:
  # Idealerweise sollte dieses Netzwerk ausschliesslich den WordPress-Container
  # und absenzdash-backend enthalten. Es wird vom Schwesterprojekt (wp-test)
  # verwaltet und ist von hier aus nicht vollstaendig kontrollierbar
  # (Audit M-1) - ausfuehrliche Doku folgt in einer spaeteren Phase in docs/.
  absenzflow-shared:
    external: true
  # Verbindet das Backend mit dem vorgelagerten nginx-Reverse-Proxy auf demselben
  # Host (TLS-Terminierung fuer den Sprung uebers Schul-Intranet, siehe
  # docs/deployment.md Abschnitt "Netzwerk"). Getrennt von absenzflow-shared,
  # da dieses Netzwerk vom Schwesterprojekt verwaltet wird und nicht mit
  # produktionsseitigem Proxy-Zugriff vermischt werden soll.
  absenzdash-proxy:
    external: true
