services:
  postgres:
    image: postgres:15-alpine
    container_name: absenzdash-db
    environment:
      POSTGRES_USER: absenzdash
      POSTGRES_PASSWORD: absenzdash
      POSTGRES_DB: absenzdash
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U absenzdash"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - absenzdash-db-data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: absenzdash-backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - ./data/schueler.csv:/tmp/schueler.csv:ro
    networks:
      - default
      - absenzflow-shared

volumes:
  absenzdash-db-data:

networks:
  default:
  absenzflow-shared:
    external: true
